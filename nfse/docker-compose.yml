# Sobe o sistema completo: aplicação + PostgreSQL.
# Uso: cp .env.example .env  (preencha)  &&  docker compose up -d
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://nfse:${POSTGRES_PASSWORD}@db:5432/nfse
    ports:
      - "127.0.0.1:3333:3333"   # exponha via proxy com HTTPS (Caddy/nginx)
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nfse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nfse
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfse"]
      interval: 5s
      retries: 10
volumes:
  dados:
